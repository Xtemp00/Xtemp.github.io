<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17231d">
  <title>Chronos Idle — V0.2</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#17231d;color:#f5f0e6;font-family:system-ui,-apple-system,sans-serif}
    .box{max-width:520px;padding:28px;text-align:center}
    .spin{width:42px;height:42px;border:3px solid #ffffff33;border-top-color:#f5f0e6;border-radius:50%;margin:0 auto 18px;animation:r 1s linear infinite}
    @keyframes r{to{transform:rotate(360deg)}}
    .err{color:#ffb4a8;white-space:pre-wrap}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body>
  <div class="box">
    <div class="spin"></div>
    <h1>CHRONOS</h1>
    <p id="status">Chargement de la V0.2…</p>
  </div>
  <script>
    (async () => {
      const status = document.getElementById('status');
      try {
        const names = ['bundle1.txt','bundle2.txt','bundle3.txt','bundle4.txt'];
        const parts = await Promise.all(names.map(async name => {
          const response = await fetch(name, {cache:'no-store'});
          if (!response.ok) throw new Error('Impossible de charger ' + name);
          return (await response.text()).trim();
        }));

        const raw = atob(parts.join(''));
        const bytes = new Uint8Array(raw.length);
        for (let i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);

        status.textContent = 'Ouverture du jeu…';
        const zip = await JSZip.loadAsync(bytes);
        const base = 'chronos-idle-v0.2/';
        const [html, css, js] = await Promise.all([
          zip.file(base + 'index.html').async('text'),
          zip.file(base + 'styles.css').async('text'),
          zip.file(base + 'game.js').async('text')
        ]);

        const cssUrl = URL.createObjectURL(new Blob([css], {type:'text/css'}));
        const jsUrl = URL.createObjectURL(new Blob([js], {type:'text/javascript'}));

        const parsed = new DOMParser().parseFromString(html, 'text/html');
        const link = parsed.querySelector('link[href="styles.css"]');
        if (link) link.href = cssUrl;
        const script = parsed.querySelector('script[src="game.js"]');
        if (script) script.src = jsUrl;

        document.open();
        document.write('<!doctype html>' + parsed.documentElement.outerHTML);
        document.close();
      } catch (error) {
        document.querySelector('.spin')?.remove();
        status.className = 'err';
        status.textContent = 'Le chargement a échoué.\n' + (error?.message || error);
      }
    })();
  </script>
</body>
</html>
